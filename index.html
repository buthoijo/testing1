<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk CF Deployer - Vault Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .log-entry { border-left: 3px solid #1e293b; padding-left: 12px; margin-bottom: 10px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .active-tab { border-bottom: 2px solid #f97316; color: white; }
        .preset-btn { transition: all 0.2s; border: 1px solid #334155; background: #161b22; }
        .preset-btn:hover { border-color: #f97316; background: #1e293b; }
        .hidden-account { filter: blur(5px); transition: filter 0.3s; }
        .hidden-account:focus { filter: blur(0); }
    </style>
</head>
<body class="bg-[#0b0e14] text-slate-300 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black text-white italic tracking-tighter uppercase">Bulk<span class="text-orange-500">Push</span> <span class="text-blue-500">Vault</span></h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-[0.3em] mt-1 font-bold">Secure Worker Automation</p>
            </div>
            <div class="flex gap-2">
                <button onclick="copyAccounts()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-[10px] font-bold flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-copy"></i> BACKUP ACCOUNTS
                </button>
                <button onclick="toggleVisibility()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-[10px] font-bold flex items-center gap-2 transition-all">
                    <i id="viewIcon" class="fa-solid fa-eye-slash"></i> <span id="viewText">HIDE</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-4">
                <div class="bg-[#161b22] p-5 rounded-2xl border border-slate-800 shadow-2xl relative">
                    <label class="text-[10px] font-black text-slate-500 uppercase flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-database text-orange-500"></i> Account Storage
                    </label>
                    <textarea id="accountList" oninput="saveData()" rows="12" placeholder="email@example.com&#10;global_api_key_here" class="w-full bg-[#0d1117] border border-slate-700 rounded-xl px-4 py-3 text-xs font-mono focus:border-orange-500 outline-none transition-all resize-none text-blue-400"></textarea>
                    
                    <div class="mt-4">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Worker Name / Subdomain</label>
                        <input id="workerName" oninput="saveData()" type="text" value="vpn-node" class="w-full mt-2 bg-[#0d1117] border border-slate-700 rounded-xl px-4 py-2 text-sm focus:border-blue-500 outline-none font-bold text-white">
                    </div>
                </div>

                <button onclick="startBulkDeploy()" id="deployBtn" class="w-full bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-bolt"></i> JALANKAN OTOMASI
                </button>
            </div>

            <div class="lg:col-span-8 space-y-4">
                <div class="bg-[#161b22] p-4 rounded-2xl border border-slate-800">
                    <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                        <button onclick="setRaw('https://r2.code-hub.workers.dev/raw/d12utk945jomod3x6je', 'Nautica V4')" class="preset-btn px-4 py-2 rounded-lg text-[10px] font-bold text-white whitespace-nowrap">Nautica Mod V4</button>
                        <button onclick="setRaw('https://r2.code-hub.workers.dev/raw/802gz2lwhkwmoqdqo3u', 'Geo V4')" class="preset-btn px-4 py-2 rounded-lg text-[10px] font-bold text-white whitespace-nowrap">Geo + UI V4</button>
                        <button onclick="setRaw('https://r2.lifetime69.workers.dev/raw/w5lc1kjeinimkfcg20a', 'VMess')" class="preset-btn px-4 py-2 rounded-lg text-[10px] font-bold text-white whitespace-nowrap">VMess Console</button>
                    </div>
                </div>

                <div class="bg-[#161b22] rounded-2xl border border-slate-800 overflow-hidden">
                    <div class="flex bg-[#21262d] border-b border-slate-800 text-[10px] font-black uppercase tracking-widest">
                        <button onclick="switchTab('raw')" id="tabRaw" class="px-6 py-3 active-tab">Raw URL</button>
                        <button onclick="switchTab('manual')" id="tabManual" class="px-6 py-3 text-slate-500">Manual Editor</button>
                    </div>
                    <div id="containerRaw" class="p-6 bg-[#0d1117]">
                        <input id="rawUrl" oninput="saveData()" type="text" placeholder="https://..." class="w-full bg-[#161b22] border border-slate-700 rounded-xl px-4 py-3 text-xs focus:border-orange-500 outline-none text-orange-400 font-mono">
                    </div>
                    <div id="containerManual" class="hidden">
                        <textarea id="scriptCode" class="w-full h-[250px] bg-[#0d1117] p-5 font-mono text-[11px] text-blue-300 outline-none resize-none"></textarea>
                    </div>
                </div>

                <div id="bulkLog" class="bg-black rounded-2xl p-6 font-mono text-[10px] border border-slate-800 h-[220px] overflow-y-auto">
                    <span class="text-slate-700">// System ready. Logs will appear here...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://api-3.vvrecgex.workers.dev"; 
        let currentMode = 'raw';
        let isHidden = false;

        // --- CORE FUNCTIONS ---

        window.onload = () => {
            const savedData = JSON.parse(localStorage.getItem('cf_deployer_data') || '{}');
            if(savedData.accounts) document.getElementById('accountList').value = savedData.accounts;
            if(savedData.worker) document.getElementById('workerName').value = savedData.worker;
            if(savedData.url) document.getElementById('rawUrl').value = savedData.url;
        };

        function saveData() {
            const data = {
                accounts: document.getElementById('accountList').value,
                worker: document.getElementById('workerName').value,
                url: document.getElementById('rawUrl').value
            };
            localStorage.setItem('cf_deployer_data', JSON.stringify(data));
        }

        function toggleVisibility() {
            isHidden = !isHidden;
            const el = document.getElementById('accountList');
            const icon = document.getElementById('viewIcon');
            const txt = document.getElementById('viewText');
            
            if(isHidden) {
                el.classList.add('hidden-account');
                icon.className = "fa-solid fa-eye";
                txt.innerText = "SHOW";
            } else {
                el.classList.remove('hidden-account');
                icon.className = "fa-solid fa-eye-slash";
                txt.innerText = "HIDE";
            }
        }

        function copyAccounts() {
            const content = document.getElementById('accountList').value;
            navigator.clipboard.writeText(content);
            alert("Daftar akun disalin ke clipboard!");
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabManual').classList.toggle('active-tab', mode === 'manual');
            document.getElementById('tabRaw').classList.toggle('active-tab', mode === 'raw');
            document.getElementById('containerManual').classList.toggle('hidden', mode !== 'manual');
            document.getElementById('containerRaw').classList.toggle('hidden', mode !== 'raw');
        }

        function setRaw(url, name) {
            switchTab('raw');
            document.getElementById('rawUrl').value = url;
            saveData();
            document.getElementById('bulkLog').innerHTML += `<div class="text-blue-400">[SET] Source changed to `+name+`</div>`;
        }

        async function startBulkDeploy() {
            const btn = document.getElementById('deployBtn');
            const logBox = document.getElementById('bulkLog');
            const rawInput = document.getElementById('accountList').value.trim();
            const workerName = document.getElementById('workerName').value.trim();
            let finalScript = "";

            if (!rawInput || !workerName) return alert("Lengkapi data!");

            btn.disabled = true;
            btn.innerHTML = 'EXECUTING...';
            logBox.innerHTML = `<div class="text-blue-500 font-bold mb-1">[SYSTEM] Memulai proses...</div>`;

            if (currentMode === 'manual') {
                finalScript = document.getElementById('scriptCode').value;
            } else {
                const url = document.getElementById('rawUrl').value.trim();
                try {
                    const res = await fetch(url);
                    finalScript = await res.text();
                    logBox.innerHTML += `<div class="text-green-500 mb-2">[INFO] Script diunduh (` + finalScript.length + ` bytes)</div>`;
                } catch (e) {
                    logBox.innerHTML += `<div class="text-red-500">[ERROR] Gagal ambil script!</div>`;
                    btn.disabled = false; return;
                }
            }

            const tokens = rawInput.split(/\s+/).filter(t => t.length > 0);
            const accounts = [];
            for (let i = 0; i < tokens.length; i += 2) {
                if (tokens[i] && tokens[i+1]) accounts.push({ email: tokens[i], key: tokens[i+1] });
            }

            for (let i = 0; i < accounts.length; i++) {
                const acc = accounts[i];
                const entry = document.createElement('div');
                entry.className = "log-entry mt-2";
                entry.innerHTML = `<span class="text-slate-500">[#` + (i + 1) + `]</span> Memproses: <span class="text-white">` + acc.email + `</span>`;
                logBox.appendChild(entry);

                try {
                    const res = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: acc.email,
                            apiKey: acc.key,
                            workerName: workerName,
                            scriptCode: finalScript
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        entry.innerHTML += `<br><span class="text-green-500 font-bold">✔ DEPLOYED:</span> <a href="` + data.url + `" target="_blank" class="text-orange-400 underline ml-1">` + data.url + `</a>`;
                    } else {
                        entry.innerHTML += `<br><span class="text-red-500 font-bold">✘ FAILED:</span> ` + (data.errors ? data.errors[0].message : 'Error');
                    }
                } catch (err) {
                    entry.innerHTML += `<br><span class="text-red-700">‼️ KONEKSI ERROR</span>`;
                }
                logBox.scrollTop = logBox.scrollHeight;
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-bolt"></i> JALANKAN OTOMASI';
            logBox.innerHTML += `<div class="text-green-500 font-bold mt-4 pt-2 border-t border-slate-800 text-center uppercase tracking-widest">--- SELESAI ---</div>`;
        }
    </script>
</body>
</html>
